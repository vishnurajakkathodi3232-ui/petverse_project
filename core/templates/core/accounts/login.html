{% extends "core/base_inner.html" %}
{% load static %}

{% block content %}
<style>
    /* Google Font */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

    .login-wrapper {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Poppins', sans-serif;
        animation: fadeIn 0.8s ease-in-out;
    }

    .login-card {
        background: #ffffff;
        padding: 40px;
        width: 100%;
        max-width: 420px;
        border-radius: 12px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        animation: slideUp 0.6s ease;
    }

    .login-card h2 {
        text-align: center;
        font-weight: 600;
        margin-bottom: 25px;
        color: #333;
    }

    .login-card form p {
        margin-bottom: 18px;
    }

    .login-card input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 14px;
    }

    .login-card input:focus {
        outline: none;
        border-color: #5cb85c;
        box-shadow: 0 0 0 2px rgba(92, 184, 92, 0.2);
    }

    .login-btn {
        width: 100%;
        padding: 12px;
        background: #5cb85c;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.3s ease;
    }

    .login-btn:hover {
        background: #4cae4c;
    }

    .register-link {
        text-align: center;
        margin-top: 18px;
        font-size: 14px;
    }

    .register-link a {
        color: #5cb85c;
        font-weight: 500;
        text-decoration: none;
    }

    .register-link a:hover {
        text-decoration: underline;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @keyframes slideUp {
        from {
            transform: translateY(30px);
            opacity: 0;
        }
        to {
            transform: translateY(0);
            opacity: 1;
        }
    }
</style>

<div class="login-wrapper">
    <div class="login-card">
        <h2>Welcome Back 👋</h2>

        {% if error %}
          <p style="color:red; text-align:center;">{{ error }}</p>
        {% endif %}


        <form method="post">
            {% csrf_token %}
            <p>
              <input type="text" name="username" placeholder="Username" required>
            </p>
            <p>
              <input type="password" name="password" placeholder="Password" required>
            </p>


            <button type="submit" class="login-btn">
                Login
            </button>
        </form>

        <div class="register-link">
            New user? <a href="{% url 'accounts:register' %}">Register first</a>
        </div>
    </div>
</div>
{% endblock %}
