{% extends "core/base_auth.html" %}

{% block title %}Signup{% endblock %}

{% block content %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

    .signup-wrapper {
        min-height: 90vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Poppins', sans-serif;
        animation: fadeIn 0.8s ease-in-out;
    }

    .signup-card {
        background: #fff;
        width: 100%;
        max-width: 520px;
        padding: 40px;
        border-radius: 14px;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.15);
        animation: slideUp 0.6s ease;
    }

    .signup-card h2 {
        text-align: center;
        font-weight: 600;
        margin-bottom: 25px;
        color: #333;
    }

    .signup-card .form-control {
        margin-bottom: 14px;
        border-radius: 6px;
        font-size: 14px;
    }

    .signup-card textarea {
        resize: none;
    }

    .signup-card label {
        font-size: 14px;
        font-weight: 500;
        margin-top: 10px;
        margin-bottom: 6px;
        color: #555;
    }

    .signup-btn {
        width: 100%;
        padding: 12px;
        font-size: 15px;
        font-weight: 500;
        border-radius: 6px;
        background-color: #5cb85c;
        border: none;
        transition: background 0.3s ease;
    }

    .signup-btn:hover {
        background-color: #4cae4c;
    }

    .login-link {
        text-align: center;
        margin-top: 18px;
        font-size: 14px;
    }

    .login-link a {
        color: #5cb85c;
        font-weight: 500;
        text-decoration: none;
    }

    .login-link a:hover {
        text-decoration: underline;
    }

    #pet-details {
        margin-top: 10px;
        padding: 12px;
        border-radius: 8px;
        background: #f9f9f9;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @keyframes slideUp {
        from { transform: translateY(30px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }
</style>

<div class="signup-wrapper">
    <div class="signup-card">
        <h2>Create an Account 🐾</h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <input class="form-control" name="username" placeholder="Username" required>

            <input class="form-control" name="email" placeholder="Email" type="email" required>

            <input class="form-control" name="full_name" placeholder="Full Name" required>

            <input class="form-control" name="phone" placeholder="Phone Number" required>

            <textarea class="form-control" name="address" placeholder="Address" rows="3" required></textarea>

            <!-- OWN A PET QUESTION -->
            <label>Do you own a pet?</label>
            <select class="form-control" name="owns_pet" id="owns-pet-select" required>
                <option value="no">No</option>
                <option value="yes">Yes</option>
            </select>

            <!-- PET DETAILS: SHOWN ONLY IF YES -->
            <div id="pet-details" style="display:none;">
                <input class="form-control" name="pet_name" placeholder="Pet Name">

                <input class="form-control" name="pet_type" placeholder="Pet Type (Dog, Cat, etc.)">

                <input class="form-control" type="file" name="pet_image">
            </div>

            <select class="form-control" name="role" required>
                <option value="">Select Role</option>
                <option value="adopter">Adopter</option>
                <option value="owner">Owner</option>
            </select>

            <input class="form-control" name="password" type="password" placeholder="Password" required>

            <button type="submit" class="btn signup-btn">
                Create Account
            </button>
        </form>

        <div class="login-link">
            Already registered?
            <a href="{% url 'login' %}">Login</a>
        </div>
    </div>
</div>

<!-- JS TO TOGGLE PET FIELDS (UNCHANGED LOGIC) -->
<script>
    document.getElementById("owns-pet-select").addEventListener("change", function () {
        var petSection = document.getElementById("pet-details");
        petSection.style.display = this.value === "yes" ? "block" : "none";
    });
</script>
{% endblock %}
